<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form class="input-container" autocomplete="off">
        <h1>Create Account</h1>

        <label for="first-name">First Name</label>
        <input type="text" id="first-name" name="first-name" placeholder="Enter First Name">

        <label for="last-name">Last Name</label>
        <input type="text" id="last-name" name="last-name" placeholder="Enter Last Name">

        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter Username">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter Email">

        <label for="password">New Password</label>
        <input type="password" id="password" name="password" placeholder="Enter New Password">

        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm Password">

        <button type="submit" id="sign-in">Register</button>
        <label for="you have already account">Already have an account? <a href="index.html">Login</a></label>

    </form>
</body>
</html>
