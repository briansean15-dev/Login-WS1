<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form class="input-container" autocomplete="off">
        <h1>Login</h1>

        <label for="username">First Name</label>
        <input type="text" id="username" name="username" placeholder="Enter First Name">

        <label for="last-name">Last Name</label>
        <input type="text" id="last-name" name="last-name" placeholder="Enter Last Name">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter Email">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter Password">

        <button type="button" id="forgot-password">Forgot Password</button>

        <label class="remember-me">
            <input type="checkbox" id="remember-me" name="remember-me">
            Remember Me
        </label>
        <button type="submit" id="login"><a href="dashboard.html">Login</a></button>
        <label for="don't-have-account">Don't have an account? <a href="newaccount.html">New Account</a></label>

    </form>
</body>
</html>
